<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>episteme · Ciclo de la memoria</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ciclo de la memoria · episteme</p>
    <h1>Cada memoria se guarda, avisa a tiempo y se mantiene al día</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ciclo-memoria-title ciclo-memoria-desc">
        <title id="ciclo-memoria-title">El ciclo de una memoria en episteme</title>
        <desc id="ciclo-memoria-desc">Una memoria se guarda, se encuentra, avisa a tiempo, se corrige y se ordena, y vuelve a guardarse; cada etapa deja su resultado en el vault, en el centro.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#2d3142"/>
        <!-- Ring -->
        <path d="M 604,114.659 A 250 250 0 0 1 710.884,207.732" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 749.095,320.746 A 250 250 0 0 1 703.455,487.279" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 542.946,588.284 A 250 250 0 0 1 458.236,588.487" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 297.245,488.254 A 250 250 0 0 1 250.806,321.942" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 288.474,208.746 A 250 250 0 0 1 394.91,115.161" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Stations -->
        <rect x="396" y="36" width="208" height="112" rx="6" fill="#2d3142"/>
        <rect x="396" y="36" width="208" height="112" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="404" y="43" width="16" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="412" y="52" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1</text>
        <text x="500.0" y="74" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guardar</text>
        <text x="500.0" y="92" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Una decisión, lección o error.</text>
        <text x="500.0" y="105" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Rechaza duplicadas y secretos.</text>
        <text x="500.0" y="134" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remember</text>
        <rect x="634" y="209" width="208" height="112" rx="6" fill="#2d3142"/>
        <rect x="634" y="209" width="208" height="112" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="642" y="216" width="16" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="650" y="225" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2</text>
        <text x="738.0" y="247" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Encontrar</text>
        <text x="738.0" y="265" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Por palabras y sinónimos,</text>
        <text x="738.0" y="278" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">sin mayúsculas ni tildes.</text>
        <text x="738.0" y="307" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search · read</text>
        <rect x="543" y="488" width="208" height="112" rx="6" fill="#2d3142"/>
        <rect x="543" y="488" width="208" height="112" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <rect x="551" y="495" width="16" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="559" y="504" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3</text>
        <text x="647.0" y="526" fill="#f08a59" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Avisar a tiempo</text>
        <text x="647.0" y="544" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Al empezar, en cada mensaje</text>
        <text x="647.0" y="557" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">y antes de editar un archivo.</text>
        <text x="647.0" y="586" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">context(mode=surface…)</text>
        <rect x="249" y="488" width="208" height="112" rx="6" fill="#2d3142"/>
        <rect x="249" y="488" width="208" height="112" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="257" y="495" width="16" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="265" y="504" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4</text>
        <text x="353.0" y="526" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Corregir</text>
        <text x="353.0" y="544" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Si una memoria quedó vieja,</text>
        <text x="353.0" y="557" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">se reemplaza o se archiva.</text>
        <text x="353.0" y="586" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">revise</text>
        <rect x="158" y="209" width="208" height="112" rx="6" fill="#2d3142"/>
        <rect x="158" y="209" width="208" height="112" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="166" y="216" width="16" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.25)" stroke-width="0.8"/>
        <text x="174" y="225" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
        <text x="262.0" y="247" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ordenar</text>
        <text x="262.0" y="265" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Unifica, archiva y enlaza.</text>
        <text x="262.0" y="278" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Lo aprueba la persona.</text>
        <text x="262.0" y="307" fill="#949eb2" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/episteme:mantencion · review</text>
        <!-- Hub -->
        <rect x="400" y="302" width="200" height="80" rx="8" fill="#2d3142"/>
        <rect x="400" y="302" width="200" height="80" rx="8" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1.6"/>
        <text x="500" y="338" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">El vault</text>
        <text x="500" y="358" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">memory/ · notas Markdown</text>
      </svg>
    </div>
  </div>
</body>
</html>
