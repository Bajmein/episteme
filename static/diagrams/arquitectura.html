<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>episteme · Arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · episteme</p>
    <h1>Un servidor MCP entre Claude Code y el vault</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-title arquitectura-desc">
        <title id="arquitectura-title">Arquitectura de episteme</title>
        <desc id="arquitectura-desc">El agente y los hooks de Claude Code, y opcionalmente agy y Copilot CLI, llaman por MCP al servidor episteme, que lee y escribe las notas Markdown del vault (memory, docs, sesiones y planes) y mantiene un índice SQLite; Obsidian puede abrir el mismo vault.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Zones -->
        <rect x="32" y="32" width="208" height="248" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <rect x="48" y="36" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="82" y="45" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLAUDE CODE</text>

        <rect x="760" y="32" width="208" height="248" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <rect x="776" y="36" width="112" height="12" rx="2" fill="#2d3142"/>
        <text x="832" y="45" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VAULT · ~/.EPISTEME</text>

        <!-- Connectors (before nodes) -->
        <path d="M 216,96 H 322 Q 330,96 330,104 V 136 Q 330,144 338,144 H 420" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 216,216 H 322 Q 330,216 330,208 V 176 Q 330,168 338,168 H 420" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580,144 H 662 Q 670,144 670,136 V 104 Q 670,96 678,96 H 784" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580,168 H 662 Q 670,168 670,176 V 208 Q 670,216 678,216 H 784" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 216,340 H 484 Q 492,340 492,332 V 188" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 216,412 H 500 Q 508,412 508,404 V 188" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="864" y1="328" x2="864" y2="256" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="261" y="76" width="40" height="12" rx="2" fill="#2d3142"/>
        <text x="281" y="85" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOLS</text>

        <rect x="255" y="196" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="281" y="205" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MCP_TOOL</text>

        <rect x="697" y="76" width="44" height="12" rx="2" fill="#2d3142"/>
        <text x="719" y="85" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INDEXA</text>

        <rect x="685" y="196" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="719" y="205" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEE/ESCRIBE</text>

        <rect x="518" y="262" width="40" height="12" rx="2" fill="#2d3142"/>
        <text x="538" y="271" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOLS</text>

        <rect x="874" y="298" width="40" height="12" rx="2" fill="#2d3142"/>
        <text x="894" y="307" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDITA</text>

        <text x="136" y="110" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mcp__episteme__*</text>

        <rect x="56" y="184" width="160" height="64" rx="6" fill="#2d3142"/>

        <!-- Node: episteme (focal) -->
        <rect x="420" y="124" width="160" height="64" rx="6" fill="#2d3142"/>

        <rect x="428" y="130" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>

        <text x="864" y="110" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.index/ · FTS5</text>

        <!-- Node: Notas Markdown -->
        <rect x="784" y="184" width="160" height="72" rx="6" fill="#2d3142"/>
        <rect x="784" y="184" width="160" height="72" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="864" y="210" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notas Markdown</text>
        <text x="864" y="226" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">memory/ · docs/</text>
        <text x="864" y="240" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sesiones/ · planes/</text>

        <!-- Node: agy (external, optional) -->
        <rect x="56" y="312" width="160" height="56" rx="6" fill="#2d3142"/>
        <rect x="56" y="312" width="160" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="136" y="332" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">agy</text>
        <text x="136" y="347" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Google Antigravity CLI</text>
        <text x="136" y="360" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tools · hooks parciales</text>

        <!-- Node: Copilot CLI (external, optional) -->
        <rect x="56" y="384" width="160" height="56" rx="6" fill="#2d3142"/>
        <rect x="56" y="384" width="160" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="136" y="404" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copilot CLI</text>
        <text x="136" y="419" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Copilot CLI</text>
        <text x="136" y="432" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tools · hooks parciales</text>

        <!-- Node: Obsidian (external, optional) -->
        <rect x="784" y="328" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="784" y="328" width="160" height="48" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="864" y="350" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Obsidian</text>
        <text x="864" y="365" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">opcional</text>

        <!-- Legend strip -->
        <line x1="32" y1="464" x2="968" y2="464" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>

        <rect x="32" y="492" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="52" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Servidor MCP</text>

        <rect x="160" y="492" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="180" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Quien llama</text>

        <rect x="280" y="492" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="300" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Almacenamiento</text>

        <line x1="512" y1="498" x2="540" y2="498" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="548" y="500" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Opcional</text>

  </div>
