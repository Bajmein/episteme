name: CI (Windows)

# Windows corre en GitHub (windows-latest): siempre en main, y en un PR solo
# si cambia algo que puede afectar a los tests.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "plugin/**"   # sus scripts (transcript_digest, doc-review) tienen tests
      - "plugin-docs/**"   # docs_check tiene tests
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Solo en repo público (en uno privado gasta cuota); el repo es público
    # desde el 16-11-2026.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # subida a Codecov por OIDC, sin token
    env:
      PYTHONUTF8: "1"   # los tests leen fixtures UTF-8 con read_text() sin encoding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # Codecov asocia el informe al commit del PR, no al merge sintético
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-python: true   # la caché de uv ya viene activa en runners de GitHub
      - run: uv sync --locked
      # Defender escanea cada archivo temporal que crean los tests; en el runner efímero sobra.
      - run: Set-MpPreference -DisableRealtimeMonitoring $true
        continue-on-error: true
      - run: uv run pytest -n auto --cov --cov-report=xml   # -n: un proceso por núcleo (pytest-xdist)
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          flags: windows
