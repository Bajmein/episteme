name: CI (Windows)

# Windows corre en GitHub (windows-latest): siempre en main, y en un PR solo
# si cambia algo que puede afectar a los tests.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "plugin/**"   # sus scripts (transcript_digest, doc-review) tienen tests
      - "plugin-docs/**"   # docs_check tiene tests
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Solo en repo público (en uno privado gasta cuota); el repo es público
    # desde el 16-11-2026.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"   # los tests leen fixtures UTF-8 con read_text() sin encoding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true   # la caché de uv ya viene activa en runners de GitHub
      - run: uv sync --locked
      - run: uv run pytest
