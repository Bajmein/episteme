name: CI (Windows)

# EN PAUSA hasta el 1 de diciembre de 2026: la cuota de Actions del mes se
# agotó y cada ejecución falla a los pocos segundos. Mientras tanto solo se
# lanza a mano (pestaña Actions o `gh workflow run "CI (Windows)"`).
#
# Para reactivarlo, cambia el bloque `on:` por este. Windows corre en GitHub
# y gasta cuota: siempre en main, y en un PR solo si cambia algo que puede
# afectar a los tests.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     paths:
#       - "src/**"
#       - "tests/**"
#       - "scripts/**"
#       - "pyproject.toml"
#       - "uv.lock"
#       - ".python-version"
#       - ".github/workflows/ci-windows.yml"
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # los tests leen fixtures UTF-8 con read_text() sin encoding
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
