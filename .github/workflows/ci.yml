name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"   # los tests leen fixtures UTF-8 con read_text() sin encoding
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest
