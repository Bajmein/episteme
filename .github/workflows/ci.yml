name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run bandit -c pyproject.toml -r src scripts -q
      - run: uv run vulture
      - run: uv run deptry .

  test:
    runs-on: [self-hosted, linux]
    env:
      PYTHONUTF8: "1"   # los tests leen fixtures UTF-8 con read_text() sin encoding
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
