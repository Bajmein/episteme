name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true   # la caché de uv ya viene activa en runners de GitHub
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run bandit -c pyproject.toml -r src scripts plugin plugin-docs -q
      - run: uv run vulture
      - run: uv run deptry .
      - run: uv run zizmor .github/workflows

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"   # los tests leen fixtures UTF-8 con read_text() sin encoding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true   # la caché de uv ya viene activa en runners de GitHub
      - run: uv sync --locked
      - run: uv run pytest
