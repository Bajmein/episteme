name: Stale

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write         # etiquetar y cerrar issues
      pull-requests: write  # etiquetar y cerrar PR
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-labels: "espera respuesta"
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: "inactivo"
          stale-pr-label: "inactivo"
          stale-issue-message: >
            Este issue lleva 30 días esperando respuesta. Se cerrará en 14 días
            si no hay novedades.
          stale-pr-message: >
            Este PR lleva 30 días esperando respuesta. Se cerrará en 14 días
            si no hay novedades.
          close-issue-message: Se cierra por falta de respuesta. Se puede reabrir cuando haya novedades.
          close-pr-message: Se cierra por falta de respuesta. Se puede reabrir cuando haya novedades.
          operations-per-run: 30
