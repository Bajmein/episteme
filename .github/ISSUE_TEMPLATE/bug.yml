name: Error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No pegues notas del vault, memorias ni credenciales. Si es una vulnerabilidad, no uses este formulario: usa «Report a vulnerability» en la pestaña Security.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué se esperaba
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Pasos mínimos, con el tool y los argumentos si se sabe.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de episteme (tag)
      placeholder: vX.Y.Z
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operativo
      placeholder: Linux, macOS o Windows
    validations:
      required: true
  - type: input
    id: cliente
    attributes:
      label: Cliente y versión
      placeholder: Claude Code 2.1.x, agy (Google Antigravity CLI) o Copilot CLI
  - type: input
    id: uv
    attributes:
      label: Versión de uv
