[project]
name = "episteme"
version = "0.22.0"
description = "Agentic memory and knowledge vault: an MCP server that serves an Obsidian-compatible Markdown vault as persistent project documentation and memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenno" }]
keywords = ["mcp", "claude-code", "obsidian", "markdown", "memory"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14.3,<3",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/Bajmein/episteme"
Issues = "https://github.com/Bajmein/episteme/issues"
Changelog = "https://github.com/Bajmein/episteme/blob/main/CHANGELOG.md"

[project.scripts]
episteme = "episteme.__main__:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # typographic characters (–, ×, ·) in user-facing strings are intentional
    "SIM102",  # nested ifs are kept where each condition reads better on its own line
    "SIM105",  # try/except/pass is kept over contextlib.suppress
    "SIM905",  # stopword lists are written as one split() string
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Each test copies the fixture vault (~0.3 MB each): keep only what failed, from one run.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
    "snowballstemmer>=3.1.1",
    "ty>=0.0.103",
    "vulture>=2.16",
    "zizmor>=1.32.0",
]

[tool.deptry]
known_first_party = ["episteme"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"

[tool.deptry.per_rule_ignores]
# scripts/measure_recall.py is a local script that runs from the repo with the dev group.
DEP004 = ["snowballstemmer"]

[tool.ty.environment]
python-version = "3.14"

[[tool.ty.overrides]]
# Tests pass fakes (SimpleNamespace, FakeStore) and deliberately wrong arguments.
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert is used to narrow types

[tool.vulture]
paths = ["src", "scripts", "tests", "plugin", "plugin-docs"]
# sqlite3.Connection.row_factory is set, not read; anyio_backend and pytestmark are pytest hooks;
# do_GET and log_message are http.server hooks (tests/test_docs_check.py); ignore_aliases is a
# yaml.SafeDumper hook (markdown._FrontmatterDumper); trigger is a session tool parameter kept
# (and ignored) since 0.18 so hooks installed before still validate.
ignore_names = [
    "row_factory", "anyio_backend", "pytestmark", "do_GET", "log_message", "ignore_aliases",
    "trigger",
]

[tool.coverage.run]
source = ["episteme"]
branch = true
# Los tests de integración arrancan el servidor en un subproceso: medirlo también.
patch = ["subprocess"]
# El cliente MCP termina el servidor con SIGTERM si no sale solo: guardar los datos igual.
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
