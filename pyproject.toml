[project]
name = "episteme"
version = "0.8.0"
description = "Agentic memory and knowledge vault: an MCP server that serves an Obsidian-compatible Markdown vault as persistent project documentation and memory."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14.3,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
episteme = "episteme.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/episteme"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "snowballstemmer>=3.1.1",
]

[tool.deptry]
known_first_party = ["episteme"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"

[tool.vulture]
paths = ["src", "scripts", "tests"]
# sqlite3.Connection.row_factory is set, not read; anyio_backend and pytestmark are pytest hooks.
ignore_names = ["row_factory", "anyio_backend", "pytestmark"]
