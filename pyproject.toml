[project]
name = "episteme-mcp"
version = "0.1.0"
description = "MCP server that serves an Obsidian-compatible Markdown vault as project documentation and memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
episteme-mcp = "episteme_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/episteme_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.deptry]
known_first_party = ["episteme_mcp"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"

[tool.vulture]
paths = ["src", "scripts", "tests"]
# sqlite3.Connection.row_factory is set, not read; anyio_backend and pytestmark are pytest hooks.
ignore_names = ["row_factory", "anyio_backend", "pytestmark"]
